<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d32">
<title>Painolaskuri</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:#111827;
 background:#dcefdc url("IMG_3983.jpeg") center/cover fixed no-repeat;
 position:relative;
}
body:before{
 content:"";
 position:fixed;
 inset:0;
 background:rgba(55,150,65,.38);
 z-index:0;
 pointer-events:none;
}
body:after{
 content:"";
 position:fixed;
 inset:0;
 background:rgba(255,255,255,.38);
 z-index:0;
 pointer-events:none;
}
main{
 position:relative;
 z-index:1;
 max-width:520px;
 margin:auto;
 padding:20px 16px 40px;
}
h1{font-size:28px;margin:8px 0 20px;color:#164d20}
.card{
 background:rgba(255,255,255,.91);
 border:1px solid rgba(40,100,45,.25);
 border-radius:18px;
 padding:16px;
 margin-bottom:14px;
 box-shadow:0 3px 12px rgba(0,70,0,.08)
}
label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
input{
 width:100%;
 font-size:20px;
 padding:13px 14px;
 border:1px solid #b8cdb8;
 border-radius:12px;
 background:white
}
.result{
 background:rgba(225,244,226,.94);
 border-radius:18px;
 padding:18px;
 text-align:center;
 margin:14px 0
}
.result small{display:block;color:#456}
.result strong{display:block;font-size:38px;margin-top:4px}
button{
 width:100%;
 padding:14px;
 border:0;
 border-radius:12px;
 font-size:17px;
 font-weight:700;
 background:#2e7d32;
 color:white;
 margin-bottom:14px
}
button:disabled{opacity:.4}
.secondary{background:rgba(255,255,255,.94);color:#245b29;border:1px solid #a9c4aa}
.row{
 display:flex;
 justify-content:space-between;
 padding:12px;
 border:1px solid #d4e2d4;
 border-radius:12px;
 margin:7px 0;
 background:rgba(250,255,250,.9)
}
.muted{color:#58705b;font-size:14px}
.total{
 display:flex;
 justify-content:space-between;
 border-top:1px solid #cddccc;
 margin-top:14px;
 padding-top:14px;
 font-weight:700
}
.empty{color:#667;font-size:14px}
.error{color:#b91c1c;font-size:14px}
</style>
</head>
<body>
<main>
<h1>⚖️ Painolaskuri</h1>

<div class="card">
<label for="net">Nettopaino (kg)</label>
<input id="net" type="number" inputmode="decimal" min="0" step="1" placeholder="Esim. 12500">
</div>

<div class="card">
<label for="gross">Bruttopaino (kg)</label>
<input id="gross" type="number" inputmode="decimal" min="0" step="1" placeholder="Syötä bruttopaino">
</div>

<div class="result">
<small>Tavaran määrä</small>
<strong id="result">— kg</strong>
<div id="message" class="muted" aria-live="polite"></div>
</div>

<button id="add" disabled>Lisää punnitus listaan</button>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<strong id="today">Tänään</strong>
<span id="count" class="muted">0 kpl</span>
</div>
<div id="list" style="margin-top:10px"></div>
<div class="total">
<span>Päivän yhteensä</span>
<span id="total">0 kg</span>
</div>
</div>

<div class="card">
<strong>Aiemmat päivät</strong>
<div id="days" style="margin-top:10px"></div>
</div>

<button id="clear" class="secondary">Tyhjennä tämän päivän punnitukset</button>
</main>

<script>
const KEY="painolaskuri_data_v1";
const $=id=>document.getElementById(id);
let data={};
try{data=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){data={}}

const dateKey=()=>{
 const d=new Date();
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`
};

const fmt=n=>Number(n).toLocaleString("fi-FI")+" kg";

const dateLabel=k=>{
 const [y,m,d]=k.split("-");
 return new Date(+y,+m-1,+d).toLocaleDateString("fi-FI",
 {weekday:"long",day:"numeric",month:"numeric",year:"numeric"})
};

function save(){
 try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}
}

function calc(){
 const n=Number($("net").value),g=Number($("gross").value);
 $("add").disabled=true;

 if($("net").value===""||$("gross").value===""){
  $("result").textContent="— kg";
  $("message").textContent="";
  return
 }

 if(!Number.isFinite(n)||!Number.isFinite(g)||n<0||g<0){
  $("result").textContent="— kg";
  $("message").textContent="Syötä kelvolliset painot.";
  return
 }

 if(g<n){
  $("result").textContent="— kg";
  $("message").textContent="Bruttopaino ei voi olla nettopainoa pienempi.";
  return
 }

 $("result").textContent=fmt(g-n);
 $("message").textContent="Bruttopaino − nettopaino";
 $("add").disabled=false;
}

function render(){
 const k=dateKey();
 const items=Array.isArray(data[k])?data[k]:[];

 $("today").textContent="Tänään · "+dateLabel(k);
 $("count").textContent=items.length+" kpl";

 $("list").innerHTML=items.length?
 items.map((x,i)=>`<div class="row"><span class="muted">#${i+1}</span><strong>${fmt(x)}</strong></div>`).join("")
 :'<div class="empty">Ei vielä punnituksia tänään.</div>';

 $("total").textContent=fmt(items.reduce((a,b)=>a+b,0));

 const keys=Object.keys(data).filter(x=>x!==k).sort().reverse();

 $("days").innerHTML=keys.length?
 keys.map(x=>{
  const a=Array.isArray(data[x])?data[x]:[];
  const s=a.reduce((p,v)=>p+v,0);

  return `
  <div class="row" style="display:block;cursor:pointer" onclick="toggleDay('${x}')">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <strong>▶ ${dateLabel(x)}</strong>
        <div class="muted">${a.length} punnitusta</div>
      </div>
      <strong>${fmt(s)}</strong>
    </div>
    <div id="day-${x}" style="display:none;margin-top:10px;border-top:1px solid #d4e2d4;padding-top:8px">
      ${a.map((v,i)=>`
        <div style="display:flex;justify-content:space-between;padding:7px 2px">
          <span class="muted">#${i+1}</span>
          <strong>${fmt(v)}</strong>
        </div>
      `).join("")}
      <div style="border-top:1px solid #d4e2d4;margin-top:6px;padding-top:8px;display:flex;justify-content:space-between">
        <strong>Yhteensä</strong>
        <strong>${fmt(s)}</strong>
      </div>
    </div>
  </div>`;
 }).join("")
 :'<div class="empty">Ei aikaisempia päiviä.</div>';
}

function toggleDay(day){
 const el=document.getElementById("day-"+day);
 if(!el)return;

 const row=el.parentElement;
 const title=row.querySelector("strong");

 if(el.style.display==="none"){
  el.style.display="block";
  title.textContent=title.textContent.replace("▶","▼");
 }else{
  el.style.display="none";
  title.textContent=title.textContent.replace("▼","▶");
 }
}

$("net").addEventListener("input",calc);
$("gross").addEventListener("input",calc);

$("add").addEventListener("click",()=>{
 const a=Number($("gross").value)-Number($("net").value);
 const k=dateKey();

 if(!Number.isFinite(a)||a<0)return;

 if(!Array.isArray(data[k]))data[k]=[];

 data[k].push(a);
 save();
 render();

 $("gross").value="";
 $("result").textContent="— kg";
 $("message").textContent="Punnitus lisätty.";
 $("add").disabled=true;
 $("gross").focus();
});

$("clear").addEventListener("click",()=>{
 const k=dateKey();
 delete data[k];
 save();
 render();
 $("gross").value="";
 calc();
});

render();
</script>
 </script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .then(() => console.log("Service Worker käytössä"))
    .catch(error => console.error("Service Worker -virhe:", error));
}
</script>

</body>
</html>
</body>
</html>
